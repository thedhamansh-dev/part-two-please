<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<p>Sending file…</p>
<script>
// Hands one file from /media/ to the page that opened or embedded this one (used to upload
// Part Two Please clips into TikTok's web uploader, whose security policy blocks direct downloads).
const p = new URLSearchParams(location.search);
const name = (p.get('n') || '').replace(/[^\w.-]/g, '');
const target = window.opener || window.parent;
if (!name) { document.body.textContent = 'no file'; }
else fetch('media/' + name)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
  .then(blob => { target.postMessage({ p2p: true, name, blob }, '*'); document.body.textContent = 'sent ' + name; if (window.opener) setTimeout(() => window.close(), 800); })
  .catch(e => target.postMessage({ p2p: true, name, error: String(e) }, '*'));
</script>
